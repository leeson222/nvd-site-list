<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skin15 전체 화면리스트</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 13px; color: #222; background: #f5f6f8; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }

  .top { display: flex; justify-content: space-between; align-items: center; padding: 22px 28px; background: #fff; border-bottom: 1px solid #e5e5e5; }
  .top h1 { font-size: 20px; font-weight: 800; }
  .top h1 { display: flex; align-items: center; }
  .top h1 img { max-width: 120px; height: auto; display: block; }
  .top h1 small { font-size: 13px; font-weight: 500; color: #888; margin-left: 12px; }
  .top p { font-size: 13px; font-weight: 600; }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 28px; background: #fff; border-bottom: 1px solid #e5e5e5; }
  .tabs button { padding: 10px 16px; border: 1px solid #ddd; border-radius: 12px; background: #fff; color: #555; }
  .tabs button.on { background: #111; border-color: #111; color: #fff; font-weight: 700; }

  .tools { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 12px 28px; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.04); }
  .server { display: flex; margin-right: auto; padding: 3px; background: #f1f2f4; border-radius: 8px; }
  .server button { padding: 6px 14px; border: 0; border-radius: 6px; background: none; color: #777; font-weight: 600; }
  .server button.on { background: #fff; color: #111; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .tools input { width: 260px; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; }
  .tools .count { color: #888; }
  .tools .count b { color: #3355ff; font-size: 16px; margin: 0 4px; }

  .wrap { padding: 20px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e5e5e5; }
  th { background: #f8f9fa; font-weight: 600; color: #444; padding: 10px 8px; border: 1px solid #e5e5e5; }
  td { padding: 9px 10px; border-bottom: 1px solid #eee; border-right: 1px solid #f0f0f0; vertical-align: middle; }
  tbody tr:nth-child(even) { background: #fafafa; }
  tbody tr:hover { background: #eef2ff; }
  td.num { text-align: center; font-weight: 600; width: 56px; }
  td.url a { display: inline-flex; align-items: center; gap: 6px; }
  td.url a:hover { color: #3355ff; text-decoration: underline; }
  td.date { text-align: center; color: #aaa; width: 100px; }
  td.type { text-align: center; width: 90px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .badge.page { background: #e8edff; color: #3355ff; }
  .badge.inc { background: #f1f1f1; color: #777; }
  td.note { color: #666; }
  .empty { text-align: center; padding: 40px; color: #999; }
  td.url a, td.note { word-break: break-all; }

  /* 태블릿: 상단 정리 + 표는 가로 스크롤 */
  @media (max-width: 1024px) {
    .top { padding: 18px 20px; }
    .tabs { padding: 12px 20px; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .tabs button { flex: none; padding: 8px 14px; }
    .tools { padding: 10px 20px; }
    .wrap { padding: 16px; overflow-x: auto; }
    table { min-width: 960px; }
  }

  /* 모바일: 표를 카드형으로 */
  @media (max-width: 768px) {
    body { font-size: 13px; }
    .top { flex-direction: column; align-items: flex-start; gap: 6px; padding: 16px; }
    .top h1 img { max-width: 100px; }
    .top h1 small { font-size: 12px; }
    .top p { font-size: 12px; color: #666; }
    .tabs { padding: 10px 16px; }
    .tools { flex-wrap: wrap; justify-content: space-between; padding: 10px 16px; }
    .server { width: 100%; margin-right: 0; }
    .server button { flex: 1; }
    .tools input { flex: 1; width: auto; min-width: 0; }

    .wrap { padding: 12px; overflow: visible; }
    table { min-width: 0; border: 0; background: none; }
    thead { display: none; }
    tbody, tr, td { display: block; }
    tbody tr { position: relative; margin-bottom: 10px; padding: 14px 14px 10px; background: #fff !important; border: 1px solid #e5e5e5; border-radius: 10px; }
    td { padding: 0; border: 0; width: auto !important; text-align: left !important; }

    td.num { position: absolute; top: 14px; right: 14px; font-size: 12px; color: #aaa; }
    td.d { display: inline; font-size: 14px; font-weight: 700; color: #111; }
    td.d:empty { display: none; }
    td.d2:not(:empty)::before, td.d3:not(:empty)::before { content: " › "; color: #bbb; font-weight: 400; }
    td.d3 { display: inline; }
    td.d3 + td { margin-top: 10px; }

    td[data-label] { display: flex; gap: 10px; padding: 5px 0; border-top: 1px dashed #eee; font-size: 12px; }
    td[data-label]::before { content: attr(data-label); flex: none; width: 58px; color: #999; }
    td.note { margin-top: 10px; }
    td.date { color: #666; }
    td.url a { display: inline; color: #3355ff; }
    .empty { padding: 30px 0; text-align: center !important; }
  }
</style>
</head>
<body>

<header class="top">
  <h1><img src="https://ecimg.cafe24img.com/pg2766b24144276030/etlandmall/logo-new03.png" alt="노바딜"><small>퍼블리싱 산출물 / skin-skin15</small></h1>

  </div>
  <input type="search" id="q" placeholder="파일명, 메뉴명 검색...">
  <span class="count">Count<b id="count">0</b></span>
</div>

<div class="wrap">

        <th rowspan="2">Num</th>

function link(path) { return BASE + (BASE === SERVERS.dev && DEV_PATH[path] || path); }

    BASE = SERVERS[b.dataset.server];

var rows = [

  ['메인', '메인 모듈', 'AI 추천 영역', '', 'index.html', 'inc', 'pages/main/ai_suggestion_area.html'],
  ['메인', '메인 모듈', '기획전 (상단)', '', 'index.html', 'inc', 'pages/main/mainPromo.html'],

  // 서브
  ['서브', '카테고리 메인', 'TV/영상가전 서브메인', '', 'pages/sub/depth1_sub_main.html', 'page', ''],

  ['서브', '검색', '상품 검색', '', 'pages/sub/product_search.html', 'page', ''],
  ['서브', '검색', 'AI 검색', '', 'pages/sub/ai_search.html', 'page', ''],
  ['서브', '검색', 'AI 검색', '검색 입력 영역', 'pages/sub/ai_search.html', 'inc', 'pages/sub/ai_search_component.html'],

  // 프로모션
  ['프로모션', '기획전', '리스트', '', 'pages/promotion/project_list.html', 'page', ''],
  ['프로모션', '기획전', '상세', '', 'pages/promotion/project_detail.html?idx=3', 'page', 'pages/promotion/project_detail.html'],
  ['프로모션', '기획전', '상세', '본문 (공통)', 'pages/promotion/project_detail.html?idx=3', 'inc', 'pages/promotion/project_detail_body.html'],
  ['프로모션', '기획전', '미리보기', '', 'pages/promotion/project_preview.html', 'page', ''],
  ['프로모션', '이벤트', '상세', '', 'pages/promotion/event_read.html', 'page', ''],

  ['프로모션', '이벤트', '미리보기', '', 'pages/promotion/event_preview.html', 'page', ''],

  ['임직원몰', '이메일 인증', '메일 발송 완료', '', 'pages/employee/employee-email-auth-sent.html', 'page', 'employee_layout'],

  ['레이아웃', '헤더', '로고 헤더 (모바일)', '', 'index.html', 'inc', 'pages/layout/header/logo_header.html'],
  ['레이아웃', '헤더', '상품 헤더 (모바일)', '', 'product/list.html?cate_no=70', 'inc', 'pages/layout/header/prod_header.html'],
  ['레이아웃', '헤더', '상품 상세 헤더 (모바일)', '', 'product/detail.html?product_no=852', 'inc', 'pages/layout/header/prod_detail_header.html'],
  ['레이아웃', '헤더', '게시판 헤더 (모바일)', '', 'board/%EA%B3%B5%EC%A7%80%EC%82%AC%ED%95%AD/1/', 'inc', 'pages/layout/header/board_header.html'],
  ['레이아웃', '푸터', '푸터', 'type01', 'index.html', 'inc', 'pages/layout/footer/footer_type01.html'],

  // 컴포넌트

];

var groups = ['전체'];
rows.forEach(function (r) { if (groups.indexOf(r[0]) < 0) groups.push(r[0]); });
var current = '전체';

var tabs = document.getElementById('tabs');
groups.forEach(function (g) {
  var b = document.createElement('button');
  b.textContent = g;
  if (g === current) b.className = 'on';
  b.onclick = function () {
    current = g;
    [].forEach.call(tabs.children, function (x) { x.className = x === b ? 'on' : ''; });
    render();
  };
  tabs.appendChild(b);
});

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

function render() {
  var q = document.getElementById('q').value.trim().toLowerCase();
  var list = rows.filter(function (r) {
    if (current !== '전체' && r[0] !== current) return false;
    return !q || r.join(' ').toLowerCase().indexOf(q) > -1;
  });
  document.getElementById('count').textContent = list.length;
  document.getElementById('list').innerHTML = list.length ? list.map(function (r, i) {
    return '<tr>' +
      '<td class="num">' + String(i + 1).padStart(2, '0') + '</td>' +
      '<td class="d d1">' + esc(r[0]) + '</td><td class="d d2">' + esc(r[1]) + '</td><td class="d d3">' + esc(r[2] + (r[3] ? ' · ' + r[3] : '')) + '</td>' +
      '<td class="note" data-label="파일 경로">' + esc(r[6].indexOf('pages/') === 0 ? r[6] : r[4]) + '</td>' +
      '<td class="date" data-label="Date">' + D + '</td>' +
      '<td class="type" data-label="구분"><span class="badge ' + r[5] + '">' + (r[5] === 'page' ? '화면' : '인클루드') + '</span></td>' +
      '<td class="url" data-label="URL"><a href="' + esc(link(r[4])) + '" target="_blank" title="' + esc(link(r[4])) + '">' + esc(link(r[4])) + '</a></td>' +
      '</tr>';
  }).join('') : '<tr><td colspan="8" class="empty">검색 결과가 없습니다.</td></tr>';
}

document.getElementById('q').addEventListener('input', render);
render();
</script>
